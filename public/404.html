<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <link rel="icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
        }

        .error-container {
            background: var(--card);
            width: min(600px, 90vw);
            padding: 30px 40px;
            border-radius: 40px;
            text-align: center;
            box-shadow:
                0 10px 20px rgba(129, 75, 29, 0.04),
                0 30px 60px rgba(129, 75, 29, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
            position: relative;
            animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-img-wrap {
            margin-bottom: 40px;
            display: inline-block;
        }

        .error-img {
            width: 100%;
            max-width: 420px;
            height: auto;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .error-img:hover {
            transform: scale(1.02);
        }

        .error-code {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text);
            margin: 0;
            letter-spacing: -0.02em;
            line-height: 1.2;
            padding: 10px;
        }

        .error-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text);
            margin: 0;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .error-back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
        }

        .error-back-link:hover {
            text-decoration: underline;
        }

        .error-container::after {
            content: "";
            position: absolute;
            bottom: -15px;
            left: 10%;
            right: 10%;
            height: 15px;
            background: rgba(0, 0, 0, 0.03);
            filter: blur(15px);
            border-radius: 50%;
            z-index: -1;
        }

        @media (max-width: 480px) {
            .error-container {
                padding: 40px 20px;
            }
            .error-title {
                font-size: 1.6rem;
            }
            .error-code {
                font-size: 1.9rem;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <p class="error-code">Error: 404</p>
        <div class="error-img-wrap">
            <img src="/images/error-404.png" alt="Иллюстрация страницы не найдена" class="error-img">
        </div>

        <h1 class="error-title">Упс...<br>Походу, что-то упало</h1>

        <a class="error-back-link" href="/">На главную</a>
    </div>

</body>
</html>
