<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram 2026 Planner</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="card hero">
        <h1>300 единиц контента челлендж</h1>
        <p class="subtitle">@romejkomart</p>
        <p id="motivation" class="motivation">Загружаю актуальные данные...</p>
      </section>

      <section class="card progress-card">
        <h2 class="progress-title">Прогресс челленджа по постам за 2026</h2>
        <div class="ring-wrap">
          <svg class="progress-ring" viewBox="0 0 160 160">
            <circle class="ring-bg" cx="80" cy="80" r="64"></circle>
            <circle id="ring-progress" class="ring-progress" cx="80" cy="80" r="64"></circle>
          </svg>
          <div class="ring-center">
            <div id="posted-this-year" class="big">0</div>
            <div class="small">из 300</div>
          </div>
        </div>
      </section>

      <section class="stats-grid">
        <article class="card stat">
          <h2>Подписчики</h2>
          <p id="followers">-</p>
        </article>
        <article class="card stat">
          <h2>Прирост подписчиков</h2>
          <p id="followers-growth">-</p>
        </article>
        <article class="card stat">
          <h2>Посты сейчас</h2>
          <p id="posts">-</p>
        </article>
        <article class="card stat">
          <h2>Осталось до 300</h2>
          <p id="remaining">-</p>
        </article>
        <article class="card stat">
          <h2>Осталось дней</h2>
          <p id="days-remaining">-</p>
        </article>
      </section>
      <section class="stats-grid">
        <article class="card stat">
          <h2>Текущее среднее в день</h2>
          <p id="avg-current">-</p>
        </article>
        <article class="card stat">
          <h2>Текущее необходимое среднее в день</h2>
          <p id="avg-required">-</p>
        </article>
      </section>

      <section class="card footer-card">
        <p id="updated-at">Обновление...</p>
        <button id="refresh-button" type="button">Обновить сейчас</button>
      </section>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
